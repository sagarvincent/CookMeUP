version: "3.8"

services:

  frontend:
    build:
      context: ./UI
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    command: npm run dev:cluster -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./UI/src:/app/src
      - /app/node_modules
    environment:
      - VITE_APP_ENV=dev_cluster
      - VITE_API_BASE=http://localhost:3001
    depends_on:
      - auth

  auth:
    build:
      context: ./API/auth
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./API/auth/src:/app/src
      - auth_data:/app/data
    environment:
      - PORT=3001
      - NODE_ENV=development
      - ACCESS_TOKEN_SECRET=dev_access_secret_change_me
      - REFRESH_TOKEN_SECRET=dev_refresh_secret_change_me
      - ACCESS_TOKEN_TTL=900
      - REFRESH_TOKEN_TTL=2592000
      - CORS_ORIGIN=http://localhost:5173

  recipes:
    build:
      context: ./API/recipes
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./API/recipes/src:/app/src
      - recipes_data:/app/data
    environment:
      - PORT=3002
      - NODE_ENV=development
      - ACCESS_TOKEN_SECRET=dev_access_secret_change_me
      - CORS_ORIGIN=http://localhost:5173

  pantry:
    build:
      context: ./API/pantry
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./API/pantry/src:/app/src
      - pantry_data:/app/data
    environment:
      - PORT=3003
      - NODE_ENV=development
      - ACCESS_TOKEN_SECRET=dev_access_secret_change_me
      - CORS_ORIGIN=http://localhost:5173

  diet-plan:
    build:
      context: ./API/diet-plan
      dockerfile: Dockerfile
    ports:
      - "3004:3004"
    volumes:
      - ./API/diet-plan/src:/app/src
      - diet_plan_data:/app/data
    environment:
      - PORT=3004
      - NODE_ENV=development
      - ACCESS_TOKEN_SECRET=dev_access_secret_change_me
      - CORS_ORIGIN=http://localhost:5173
      - RECIPES_API_BASE=http://recipes:3002
    depends_on:
      - recipes

  shopping-list:
    build:
      context: ./API/shopping-list
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    volumes:
      - ./API/shopping-list/src:/app/src
      - shopping_list_data:/app/data
    environment:
      - PORT=3005
      - NODE_ENV=development
      - ACCESS_TOKEN_SECRET=dev_access_secret_change_me
      - CORS_ORIGIN=http://localhost:5173
      - DIET_PLAN_API_BASE=http://diet-plan:3004
      - RECIPES_API_BASE=http://recipes:3002
      - PANTRY_API_BASE=http://pantry:3003
    depends_on:
      - diet-plan
      - pantry

volumes:
  auth_data:
  recipes_data:
  pantry_data:
  diet_plan_data:
  shopping_list_data:
